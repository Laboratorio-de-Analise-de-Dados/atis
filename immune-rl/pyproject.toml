[project]
name = "immune-rl"
version = "0.1.0"
description = "Simulação do sistema imunológico com aprendizado por reforço multiagente"
readme = "README.md"
authors = [
    { name = "Felipe Cortez", email = "fecortez.marcolino@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "pytest>=9.1.1",
]

[project.scripts]
immune-rl = "immune_rl:main"

[dependency-groups]
dev = ["ruff>=0.14"]

[build-system]
requires = ["uv_build>=0.11.7,<0.15.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["immune_rl"]
